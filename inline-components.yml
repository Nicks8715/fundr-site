name: Inline header and footer

# Runs inline_components.py whenever a page or the script changes,
# so the header and footer are always in the page source for search engines.
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '*.html'
      - '**/*.html'
      - 'inline_components.py'

jobs:
  inline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inline components
        run: python3 inline_components.py
      - name: Commit any changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Inline header and footer into pages"
            git push
          else
            echo "Nothing to change"
          fi
